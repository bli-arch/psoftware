[package]
name = "psoft"
version = "0.1.0"
description = "PSoftware desktop application"
authors = ["PSoftware"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "psoft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.28"  # or the latest version
reqwest = { version = "0.11", features = ["json", "cookies", "blocking", "multipart"] }
tokio = { version = "1", features = ["full"] }
dirs = "4.0"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
base64 = "0.22.1"
minisign-verify = "0.2.5"
argon2 = "0.5.3"
hmac = "0.12.1"
sha2 = "0.10.9"
mdns-sd = "0.20.2"
semver = "1"
ring = "0.17.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_System_Com", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
webview2-com = "0.38.2"

[profile.dev.package."*"]
debug = 0
